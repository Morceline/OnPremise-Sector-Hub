[package]
name = "assistente-setor"
version = "0.1.0"
description = "Widget desktop do Assistente de Setor"
edition = "2021"

[lib]
name = "assistente_setor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Reduz o tamanho do binário final — relevante porque o widget roda em
# máquinas de usuário com disco limitado.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
